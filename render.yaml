# Render Blueprint — Lumint backend.
#
# Canonical Render config lives at the repository root. The backend uses the
# Docker runtime so Dockerfile.prod installs tesseract-ocr and system libraries
# required by OCR/Pillow/OpenCV before Gunicorn starts FastAPI with Uvicorn
# workers.

services:
  - type: web
    name: lumint-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile.prod
    dockerContext: .
    plan: free
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: lumint-db
          property: connectionString
      - key: CORS_ALLOW_ORIGINS
        value: '["https://lumint-pi.vercel.app","https://lumint.vercel.app"]'
      - key: LUMINT_API_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: ML_MODEL_PATH
        value: /app/ml/models
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: lumint-db
    plan: free
    databaseName: lumint
    user: lumint
