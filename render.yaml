# Render Blueprint — Lumint backend.
#
# Uses Docker runtime so the Dockerfile.prod (which installs tesseract-ocr
# + libgl + libglib for Pillow/OpenCV) is used instead of the plain Python
# buildpack — tesseract is required for UPI OCR.

services:
  - type: web
    name: lumint-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile.prod
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: lumint-db
          property: connectionString
      - key: CORS_ALLOW_ORIGINS
        value: '["https://lumint-pi.vercel.app"]'
      - key: JWT_SECRET
        generateValue: true
      - key: LUMINT_API_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: ML_MODEL_PATH
        value: /app/ml/models
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: lumint-db
    plan: starter
    databaseName: lumint
    user: lumint
