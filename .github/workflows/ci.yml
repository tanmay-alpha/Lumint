name: Python Backend CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  python-backend-checks:
    name: Python backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Locate requirements file
        id: requirements
        shell: bash
        run: |
          if [ -f "requirements.txt" ]; then
            echo "path=requirements.txt" >> "$GITHUB_OUTPUT"
          elif [ -f "backend/requirements.txt" ]; then
            echo "path=backend/requirements.txt" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ steps.requirements.outputs.path }}" ]; then
            pip install -r "${{ steps.requirements.outputs.path }}"
          else
            echo "No requirements.txt found. Installing pytest only."
            pip install pytest
          fi

      - name: Python syntax check
        shell: bash
        run: |
          python -m compileall .

      - name: Run tests if present
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          if [ -d "tests" ]; then
            python -m pytest -q
          else
            echo "No tests folder found. Skipping pytest."
          fi
